name: Compiler le mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Les commits faits par le robot (jar / logs) ne relancent pas de compilation
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Numéro de version (1.0.0, 1.0.1... un nouveau à chaque compilation)
        id: version
        run: |
          V="1.0.$(( ${{ github.run_number }} - 1 ))"
          echo "Version du mod : $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Compiler
        run: |
          set -o pipefail
          gradle build --stacktrace -Pmod_version="${{ steps.version.outputs.version }}" 2>&1 | tee /tmp/build.log

      - name: Mettre le .jar dans le dossier "telechargement" du dépôt
        run: |
          mkdir -p telechargement
          rm -f telechargement/*.jar
          for f in build/libs/*.jar; do case "$f" in *-sources.jar) ;; *) cp "$f" telechargement/;; esac; done
          echo "Compilation réussie : Feurleg ${{ steps.version.outputs.version }} (essai n°${{ github.run_number }}) le $(date -u '+%Y-%m-%d %H:%M UTC')" > telechargement/statut.txt
          ls telechargement/*.jar | xargs -n1 basename >> telechargement/statut.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telechargement
          git commit -q -m "Nouveau .jar compilé (essai n°${{ github.run_number }})" || exit 0
          for i in 1 2 3; do
            if git push; then exit 0; fi
            sleep 5
            git pull -q --rebase origin "${GITHUB_REF_NAME}" || true
          done
          exit 1

      - name: Enregistrer l'erreur de compilation
        if: failure()
        run: |
          touch /tmp/build.log
          mkdir -p ci
          { echo "ECHEC essai n°${{ github.run_number }}"; echo; grep -nE "error:|FAILURE|What went wrong|Could not" /tmp/build.log | head -n 120; echo; echo "----- fin du log -----"; tail -n 150 /tmp/build.log; } > "ci/erreur-${{ github.run_number }}.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci
          git commit -q -m "Log d'erreur (essai n°${{ github.run_number }})" || true
          for i in 1 2 3; do git pull -q --rebase origin "${GITHUB_REF_NAME}" || true; if git push; then break; fi; sleep 5; done
